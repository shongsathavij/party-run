# Run the agent evals from GitHub: Actions tab > "Agent evals" > Run workflow.
# Needs a repository secret named ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
# Commits the results file and the updated history back to the branch.
name: Agent evals

on:
  workflow_dispatch:
    inputs:
      agent:
        description: claude or rules
        default: claude
        type: choice
        options: [claude, rules]
      model:
        description: Model to shop with
        default: claude-haiku-5-5
        type: choice
        options: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5]
      runs:
        description: How many runs (each run plans all 15 prompts; 1 is cheapest, 2 checks consistency)
        default: '2'

permissions:
  contents: write

jobs:
  evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit checks
        run: npm test
      - name: Evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node evals/run.js --agent ${{ inputs.agent }} --model ${{ inputs.model }} --runs ${{ inputs.runs }} | tee eval-output.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat eval-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Save results
        if: always()
        run: |
          git config user.name "eval-bot"
          git config user.email "eval-bot@users.noreply.github.com"
          git add evals/results
          git commit -m "Eval results: ${{ inputs.agent }} ${{ inputs.model }}" || echo "Nothing to commit"
          git push
